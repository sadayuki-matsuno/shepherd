name: Release

# Tag `vX.Y.Z` → test, build, zip the .app, publish a GitHub Release with the zip + checksum.
# The runner has no "shepherd-dev" cert, so build.sh falls back to ad-hoc signing — first launch
# needs right-click → Open (or `--no-quarantine` via Homebrew) until the app is notarized.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # Fine-grained PAT with contents:write on sadayuki-matsuno/homebrew-tap.
      # Absent → the tap step is skipped and the cask must be bumped by hand.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: ./test.sh

      - name: Build app
        run: ./build.sh --no-install

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent build/Shepherd.app "Shepherd-${VERSION}.zip"
          shasum -a 256 "Shepherd-${VERSION}.zip" | tee "Shepherd-${VERSION}.zip.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Shepherd $GITHUB_REF_NAME" \
            --generate-notes \
            Shepherd-*.zip Shepherd-*.zip.sha256

      # Keep `brew install` current: rewrite the cask's version + sha256 to this
      # release. The zip the checksum names is the one uploaded above, so the cask
      # can never point at an asset that doesn't exist yet.
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 "Shepherd-${VERSION}.zip.sha256")
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sadayuki-matsuno/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/shepherd.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/shepherd.rb
          if git diff --quiet -- Casks/shepherd.rb; then echo "cask already at ${VERSION}"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "shepherd ${VERSION}"
          git push
